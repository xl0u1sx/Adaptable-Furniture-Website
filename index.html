<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adaptable Furniture — Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  </head>
  <body class="page-home">
    <header class="site-header">
      <div class="desk-header">
        <div class="af-logo">
          <a class="site-header__logo site-header__logo--mark" href="index.html" aria-label="Adaptable Furniture home">
            <img src="img/Logo.png" alt="" width="180" height="48" decoding="async" />
          </a>
        </div>
        <a href="why-af.html">Why AF?</a>
        <a href="shop.html">Store</a>
        <a href="about.html">About</a>       
        <a href="invest.html">Invest</a>
        <a class="site-header__cart" href="shop.html?cart=1" aria-label="Open shopping cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
          <span class="site-header__cart-count is-hidden" data-cart-count-badge>0</span>
        </a>
      </div>
      <button
        type="button"
        class="site-header__menu"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="nav-overlay"
        data-nav-open
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    </header>

    <div class="site-blur" data-home-load>
      <main class="page-wrap">
        <section class="hero" aria-label="Featured product">
          <div class="hero__glass-top">
            <p class="hero__hint">
              <span aria-hidden="true">◆</span>
              Pinch with two fingers to zoom and use one finger to orbit.
            </p>
            <h1 class="hero__title">Furniture done right.</h1>
          </div>
          <div class="hero__viewer">
            <model-viewer
              src="3dassets/sofa.glb"
              alt="Sea foam green and glacier blue floor seating set"
              camera-controls
              auto-rotate
              shadow-intensity="1"
              style="width:100%;height:100%;background:transparent;"
            ></model-viewer>
          </div>
          <div class="hero__glass-bottom hero__glass-bottom--cta">
            <a class="hero__btn-shop af-shop-cta" href="shop.html">Shop Adaptable Furniture</a>
          </div>
        </section>
      </main>
    </div>

    <div
      id="nav-overlay"
      class="nav-overlay"
      role="dialog"
      aria-modal="true"
      aria-label="Site menu"
      aria-hidden="true"
    >
      <button type="button" class="nav-overlay__close" data-nav-close aria-label="Close menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
      <a class="site-header__logo site-header__logo--mark nav-overlay__brand" href="index.html" aria-label="Adaptable Furniture home">
        <img src="img/Logo.png" alt="" width="180" height="48" decoding="async" />
      </a>
      <nav class="nav-overlay__links" aria-label="Primary">
        <a href="index.html" data-nav>Home</a>
        <a href="about.html" data-nav>About</a>
        <a href="why-af.html" data-nav>Why AF?</a>
        <a href="shop.html" data-nav>Shop</a>
        <a href="invest.html" data-nav>Invest</a>
      </nav>
    </div>

    <script src="js/app.js" defer></script>
    <script src="js/home-load.js" defer></script>
  </body>
</html>
