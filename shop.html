<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop — Adaptable Furniture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page-shop" data-shop-root>
    <header class="site-header">
      <div class="desk-header">
        <div class="af-logo">
          <a class="site-header__logo site-header__logo--mark" href="index.html" aria-label="Adaptable Furniture home">
            <img src="img/Logo.png" alt="" width="180" height="48" decoding="async" />
          </a>
        </div>
        <a href="why-af.html">Why AF?</a>
        <a class="active" href="shop.html">Store</a>
        <a href="about.html">About</a>       
        <a href="invest.html">Invest</a>
        <a class="site-header__cart" href="shop.html?cart=1" aria-label="Open shopping cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
          <span class="site-header__cart-count is-hidden" data-cart-count-badge>0</span>
        </a>
      </div>
      <button
        type="button"
        class="site-header__menu"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="nav-overlay"
        data-nav-open
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    </header>

    <div class="site-blur">
      <main class="page-wrap">
        <section class="shop-intro" aria-label="Shop intro">
          <p class="shop-intro__kicker">Adaptive Collection</p>
          <h1 class="shop-intro__title">Modular pieces built for flexible living.</h1>
          <p class="shop-intro__sub">Discover colorways designed to move with your space.</p>
        </section>
        <div class="shop-toolbar">
          <div class="search-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3-3" />
            </svg>
            <label class="sr-only" for="shop-search">Search products</label>
            <input id="shop-search" type="search" placeholder="Search" autocomplete="off" data-search />
            <button type="button" class="icon-btn" data-open-filter aria-label="Filter by color">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 6h16M7 12h10M10 18h4" />
              </svg>
            </button>
          </div>
          <button type="button" class="btn-cart-nav" data-open-cart>
            Go to cart<span class="cart-count"></span>
          </button>
        </div>
        <p class="shop-results" data-results-count aria-live="polite"></p>

        <div class="product-list" data-product-list aria-live="polite"></div>
      </main>
    </div>

    <div id="cart-panel" class="shop-panel shop-panel--cart" role="dialog" aria-modal="true" aria-label="Shopping cart" aria-hidden="true">
      <div class="shop-panel__bar">
        <button type="button" class="shop-panel__back" data-close-cart aria-label="Back to shop">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 6l-6 6 6 6" />
          </svg>
        </button>
        <div class="shop-panel__title-pill">Shopping Cart</div>
        <span class="shop-panel__total"><span data-cart-total>$0</span></span>
      </div>
      <div class="shop-panel__body">
        <div data-cart-list></div>
      </div>
      <div class="shop-panel__footer">
        <div class="cart-summary">
          <span>Subtotal</span>
          <strong data-cart-total-footer>$0</strong>
        </div>
        <p class="cart-summary__note">Taxes and shipping are calculated at checkout.</p>
        <button type="button" class="btn-primary" data-checkout>Check out</button>
      </div>
    </div>

    <div id="filter-panel" class="shop-panel" role="dialog" aria-modal="true" aria-label="Filter products" aria-hidden="true">
      <div class="shop-panel__bar">
        <button type="button" class="shop-panel__back" data-close-filter aria-label="Back to shop">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 6l-6 6 6 6" />
          </svg>
        </button>
        <div class="shop-panel__title-pill">Filter by Color</div>
        <span class="shop-panel__total" aria-hidden="true"></span>
      </div>
      <div class="shop-panel__body">
        <form id="filter-form" class="filter-glass">
          <h3>Colors</h3>
          <div class="filter-row">
            <input type="checkbox" name="colors" id="c-green" value="green" />
            <label for="c-green">Green</label>
            <div class="filter-swatch-bar" style="background: #b3d4cf"></div>
          </div>
          <div class="filter-row">
            <input type="checkbox" name="colors" id="c-blue" value="blue" />
            <label for="c-blue">Blue</label>
            <div class="filter-swatch-bar" style="background: #a9bfcb"></div>
          </div>
          <div class="filter-row">
            <input type="checkbox" name="colors" id="c-purple" value="purple" />
            <label for="c-purple">Purple</label>
            <div class="filter-swatch-bar" style="background: #b9a7cc"></div>
          </div>
          <div class="filter-row">
            <input type="checkbox" name="colors" id="c-pink" value="pink" />
            <label for="c-pink">Pink</label>
            <div class="filter-swatch-bar" style="background: #e3bed4"></div>
          </div>
          <div class="filter-row">
            <input type="checkbox" name="colors" id="c-red" value="red" />
            <label for="c-red">Red</label>
            <div class="filter-swatch-bar" style="background: #d7b2b4"></div>
          </div>
          <div class="filter-row">
            <input type="checkbox" name="colors" id="c-brown" value="brown" />
            <label for="c-brown">Brown</label>
            <div class="filter-swatch-bar" style="background: #d9c0ab"></div>
          </div>
          <div class="filter-row">
            <input type="checkbox" name="colors" id="c-orange" value="orange" />
            <label for="c-orange">Orange</label>
            <div class="filter-swatch-bar" style="background: #f4eee1"></div>
          </div>
          <div class="filter-row">
            <input type="checkbox" name="colors" id="c-yellow" value="yellow" />
            <label for="c-yellow">Yellow</label>
            <div class="filter-swatch-bar" style="background: #f2f6dc"></div>
          </div>
          <label class="filter-toggle">
            <input type="checkbox" name="customOnly" />
            Only show me products that supports custom color!
          </label>
        </form>
      </div>
      <div class="shop-panel__footer">
        <button type="button" class="btn-secondary" data-apply-filter>Search with selected filter</button>
      </div>
    </div>

    <div
      id="nav-overlay"
      class="nav-overlay"
      role="dialog"
      aria-modal="true"
      aria-label="Site menu"
      aria-hidden="true"
    >
      <button type="button" class="nav-overlay__close" data-nav-close aria-label="Close menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
      <a class="site-header__logo site-header__logo--mark nav-overlay__brand" href="index.html" aria-label="Adaptable Furniture home">
        <img src="img/Logo.png" alt="" width="180" height="48" decoding="async" />
      </a>
      <nav class="nav-overlay__links" aria-label="Primary">
        <a href="index.html" data-nav>Home</a>
        <a href="about.html" data-nav>About</a>
        <a href="why-af.html" data-nav>Why AF?</a>
        <a href="shop.html" data-nav>Shop</a>
        <a href="invest.html" data-nav>Invest</a>
      </nav>
    </div>

    <script src="js/app.js" defer></script>
    <script src="js/shop.js" defer></script>
  </body>
</html>
